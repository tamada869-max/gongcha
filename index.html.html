<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gong cha 新店出店 タスク管理 [Firebase版]</title>
<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getDatabase, ref, set, onValue, remove }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
  window._fbReady = { initializeApp, getDatabase, ref, set, onValue, remove };
</script>
<style>
  :root {
    --primary: #1a6b3c; --primary-light: #2d9e5f; --primary-dark: #0f4526;
    --accent: #f5a623; --accent2: #e8f5ee; --bg: #f4f6f8; --card: #ffffff;
    --text: #1a1a2e; --text-muted: #6b7280; --border: #e2e8f0;
    --todo: #6b7280; --inprogress: #3b82f6; --done: #10b981; --overdue: #ef4444;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI','Hiragino Sans','Yu Gothic',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: white; padding: 0 24px; display: flex; align-items: center;
    justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .logo span { color: var(--accent); }
  .header-subtitle { font-size: 12px; opacity: 0.8; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .go-date-area {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 20px; padding: 4px 14px;
  }
  .go-date-label { font-size: 11px; opacity: 0.8; white-space: nowrap; }
  .go-date-input {
    background: transparent; border: none; color: white; font-size: 13px;
    font-weight: 700; outline: none; cursor: pointer; width: 110px; color-scheme: dark;
  }
  .go-date-input::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.7; cursor: pointer; }
  .store-badge {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px; padding: 4px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background 0.2s;
  }
  .store-badge:hover { background: rgba(255,255,255,0.25); }
  .tabs {
    background: white; border-bottom: 2px solid var(--border);
    display: flex; padding: 0 24px; gap: 4px; overflow-x: auto;
  }
  .tab {
    padding: 14px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    border-bottom: 3px solid transparent; color: var(--text-muted);
    transition: all 0.2s; white-space: nowrap; display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { color: var(--primary); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card {
    background: var(--card); border-radius: 12px; padding: 20px;
    box-shadow: var(--shadow); border-left: 4px solid transparent; transition: transform 0.2s;
  }
  .stat-card:hover { transform: translateY(-2px); }
  .stat-card.total { border-left-color: var(--primary); }
  .stat-card.done { border-left-color: var(--done); }
  .stat-card.inprogress { border-left-color: var(--inprogress); }
  .stat-card.todo { border-left-color: var(--todo); }
  .stat-card.overdue { border-left-color: var(--overdue); }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 32px; font-weight: 800; }
  .stat-card.total .stat-value { color: var(--primary); }
  .stat-card.done .stat-value { color: var(--done); }
  .stat-card.inprogress .stat-value { color: var(--inprogress); }
  .stat-card.todo .stat-value { color: var(--todo); }
  .stat-card.overdue .stat-value { color: var(--overdue); }
  .progress-section { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 24px; }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .progress-title { font-size: 15px; font-weight: 700; }
  .progress-pct { font-size: 24px; font-weight: 800; color: var(--primary); }
  .progress-bar-bg { background: var(--border); border-radius: 99px; height: 12px; overflow: hidden; }
  .progress-bar-fill { background: linear-gradient(90deg, var(--primary), var(--primary-light)); height: 100%; border-radius: 99px; transition: width 0.6s ease; }
  .progress-phases { display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
  .phase-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; background: var(--bg); border-radius: 8px; padding: 6px 12px; }
  .phase-dot { width: 8px; height: 8px; border-radius: 50%; }
  .filter-bar {
    background: var(--card); border-radius: 12px; padding: 16px 20px;
    box-shadow: var(--shadow); margin-bottom: 20px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .filter-bar input, .filter-bar select {
    border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 12px;
    font-size: 13px; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.2s;
  }
  .filter-bar input:focus, .filter-bar select:focus { border-color: var(--primary); }
  .filter-bar input { flex: 1; min-width: 200px; }
  .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-outline { background: white; color: var(--primary); border: 1.5px solid var(--primary); }
  .btn-outline:hover { background: var(--accent2); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .phase-section { margin-bottom: 24px; }
  .phase-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; cursor: pointer; user-select: none; }
  .phase-title { font-size: 16px; font-weight: 800; color: var(--primary-dark); }
  .phase-count { background: var(--primary); color: white; border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
  .phase-toggle { margin-left: auto; color: var(--text-muted); font-size: 18px; transition: transform 0.2s; }
  .phase-toggle.collapsed { transform: rotate(-90deg); }
  .task-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .task-table th { background: var(--primary-dark); color: white; padding: 12px 16px; font-size: 12px; font-weight: 700; text-align: left; text-transform: uppercase; letter-spacing: 0.5px; }
  .task-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  .task-table tr:last-child td { border-bottom: none; }
  .task-table tr:hover td { background: var(--accent2); }
  .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .status-todo { background: #f1f5f9; color: var(--todo); }
  .status-inprogress { background: #eff6ff; color: var(--inprogress); }
  .status-done { background: #f0fdf4; color: var(--done); }
  .status-overdue { background: #fef2f2; color: var(--overdue); }
  .assignee-badge { background: var(--accent2); color: var(--primary-dark); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 700; }
  .task-name { font-weight: 600; }
  .task-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .date-cell { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .date-overdue { color: var(--overdue); font-weight: 700; }
  .action-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 11px; color: var(--text-muted); transition: all 0.2s; margin-right: 4px; }
  .action-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--accent2); }
  .gantt-container { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .gantt-scroll { overflow-x: auto; }
  .gantt-table { border-collapse: collapse; min-width: 100%; }
  .gantt-table th { background: var(--primary-dark); color: white; padding: 8px 6px; font-size: 11px; text-align: center; white-space: nowrap; min-width: 28px; }
  .gantt-table th.task-col { min-width: 200px; text-align: left; padding-left: 16px; position: sticky; left: 0; z-index: 3; border-right: 2px solid rgba(255,255,255,0.2); box-shadow: 2px 0 6px rgba(0,0,0,0.15); }
  .gantt-table th.month-header { background: var(--primary); font-size: 12px; font-weight: 800; }
  .gantt-table td { padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 12px; vertical-align: middle; }
  .gantt-table td.task-col { padding-left: 16px; min-width: 200px; font-weight: 600; position: sticky; left: 0; background: white; z-index: 2; border-right: 2px solid var(--border); box-shadow: 2px 0 6px rgba(0,0,0,0.06); }
  .gantt-table tr:hover td { background: var(--accent2); }
  .gantt-table tr:hover td.task-col { background: var(--accent2); }
  .gantt-bar { height: 18px; border-radius: 4px; background: linear-gradient(90deg, var(--primary), var(--primary-light)); }
  .gantt-bar.done { background: linear-gradient(90deg, var(--done), #34d399); }
  .gantt-bar.inprogress { background: linear-gradient(90deg, var(--inprogress), #60a5fa); }
  .gantt-bar.overdue { background: linear-gradient(90deg, var(--overdue), #f87171); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 16px; padding: 28px; width: 90%; max-width: 560px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-size: 18px; font-weight: 800; color: var(--primary-dark); }
  .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-input, .form-select, .form-textarea { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; transition: border-color 0.2s; font-family: inherit; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary); }
  .form-textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .comment-section { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
  .comment-item { background: var(--bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .comment-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .comment-text { font-size: 13px; }
  .comment-input-row { display: flex; gap: 8px; margin-top: 10px; }
  .comment-input-row input { flex: 1; border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; outline: none; }
  .comment-input-row input:focus { border-color: var(--primary); }
  .store-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .store-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; }
  .store-item:hover { border-color: var(--primary); background: var(--accent2); }
  .store-item.active { border-color: var(--primary); background: var(--accent2); }
  .store-item-name { font-weight: 700; font-size: 14px; }
  .store-item-date { font-size: 12px; color: var(--text-muted); }
  @media (max-width: 768px) {
    main { padding: 12px 16px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .filter-bar { flex-direction: column; }
    .filter-bar input { min-width: unset; }
    .form-row { grid-template-columns: 1fr; }
    header { padding: 0 16px; }
    .tab { padding: 12px 14px; font-size: 13px; }
  }
  .hidden { display: none !important; }
  .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--primary-dark); color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 999; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .sync-badge { position: fixed; top: 68px; right: 16px; background: #10b981; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .sync-badge.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Gong <span>cha</span></div>
    <div class="header-subtitle">新店出店 タスク管理システム</div>
  </div>
  <div class="header-right">
    <div class="go-date-area">
      <span class="go-date-label">🎯 GO日</span>
      <input type="date" class="go-date-input" id="header-go-date" onchange="onHeaderGoDateChange()">
    </div>
    <div class="store-badge" onclick="openStoreModal()">🏪 <span id="currentStoreName">読み込み中...</span> ▾</div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('dashboard')" id="tab-dashboard"><span>📊</span>ダッシュボード</div>
  <div class="tab" onclick="switchTab('tasks')" id="tab-tasks"><span>✅</span>タスク一覧</div>
  <div class="tab" onclick="switchTab('gantt')" id="tab-gantt"><span>📅</span>ガントチャート</div>
</div>

<main>
  <!-- DASHBOARD -->
  <div id="view-dashboard">
    <div class="stats-grid">
      <div class="stat-card total"><div class="stat-label">総タスク数</div><div class="stat-value" id="stat-total">0</div></div>
      <div class="stat-card done"><div class="stat-label">✅ 完了</div><div class="stat-value" id="stat-done">0</div></div>
      <div class="stat-card inprogress"><div class="stat-label">🔵 進行中</div><div class="stat-value" id="stat-inprogress">0</div></div>
      <div class="stat-card todo"><div class="stat-label">⚪ 未着手</div><div class="stat-value" id="stat-todo">0</div></div>
      <div class="stat-card overdue"><div class="stat-label">🔴 期限超過</div><div class="stat-value" id="stat-overdue">0</div></div>
    </div>
    <div class="progress-section">
      <div class="progress-header"><div class="progress-title">全体進捗</div><div class="progress-pct" id="progress-pct">0%</div></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>
      <div class="progress-phases" id="phase-progress"></div>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:24px;">
      <div style="background:white; border-radius:12px; padding:20px; box-shadow:var(--shadow);">
        <div style="font-size:15px; font-weight:800; margin-bottom:14px; color:var(--primary-dark);">⚠️ 期限が近いタスク（7日以内）</div>
        <div id="upcoming-tasks"></div>
      </div>
      <div style="background:white; border-radius:12px; padding:20px; box-shadow:var(--shadow);">
        <div style="font-size:15px; font-weight:800; margin-bottom:14px; color:var(--primary-dark);">👤 担当者別タスク数</div>
        <div id="assignee-stats"></div>
      </div>
    </div>
    <div style="background:linear-gradient(135deg,var(--primary-dark),var(--primary)); color:white; border-radius:12px; padding:24px; box-shadow:var(--shadow); text-align:center;">
      <div style="font-size:13px; opacity:0.8; margin-bottom:8px;">グランドオープンまで</div>
      <div id="countdown-days" style="font-size:56px; font-weight:900; line-height:1;"></div>
      <div style="font-size:14px; opacity:0.8; margin-top:8px;" id="countdown-date"></div>
    </div>
  </div>

  <!-- TASK LIST -->
  <div id="view-tasks" class="hidden">
    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="🔍 タスク名・内容で検索..." oninput="renderTasks()">
      <select id="filter-status" onchange="renderTasks()">
        <option value="">すべてのステータス</option>
        <option value="todo">未着手</option>
        <option value="inprogress">進行中</option>
        <option value="done">完了</option>
        <option value="overdue">期限超過</option>
      </select>
      <select id="filter-phase" onchange="renderTasks()">
        <option value="">すべてのフェーズ</option>
        <option value="引渡しまでに行うこと">引渡し前</option>
        <option value="引渡し後に行うこと">引渡し後</option>
        <option value="GO後に行うこと">GO後</option>
      </select>
      <select id="filter-assignee" onchange="renderTasks()"><option value="">すべての担当者</option></select>
      <button class="btn btn-primary" onclick="openAddModal()">＋ タスク追加</button>
    </div>
    <div id="task-list-container"></div>
  </div>

  <!-- GANTT -->
  <div id="view-gantt" class="hidden">
    <div class="filter-bar">
      <select id="gantt-filter-phase" onchange="renderGantt()">
        <option value="">すべてのフェーズ</option>
        <option value="引渡しまでに行うこと">引渡し前</option>
        <option value="引渡し後に行うこと">引渡し後</option>
        <option value="GO後に行うこと">GO後</option>
      </select>
      <select id="gantt-filter-status" onchange="renderGantt()">
        <option value="">すべてのステータス</option>
        <option value="todo">未着手</option>
        <option value="inprogress">進行中</option>
        <option value="done">完了</option>
      </select>
      <span style="font-size:12px; color:var(--text-muted); margin-left:auto;">🟩 完了 &nbsp; 🟦 進行中 &nbsp; ⬜ 未着手 &nbsp; 🟥 期限超過 &nbsp; 🟨 今日</span>
    </div>
    <div class="gantt-container"><div class="gantt-scroll"><div id="gantt-content"></div></div></div>
  </div>
</main>

<!-- TASK MODAL -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">タスク詳細</div>
      <button class="modal-close" onclick="closeModal('task-modal')">×</button>
    </div>
    <div class="form-group"><label class="form-label">タスク名 *</label><input type="text" class="form-input" id="modal-name" placeholder="タスク名を入力"></div>
    <div class="form-group"><label class="form-label">内容・説明</label><textarea class="form-textarea" id="modal-desc" placeholder="詳細説明"></textarea></div>
    <div class="form-group"><label class="form-label">メモ</label><input type="text" class="form-input" id="modal-memo" placeholder="メモ"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">担当者</label><input type="text" class="form-input" id="modal-assignee" placeholder="例: SV, FBL, GM"></div>
      <div class="form-group"><label class="form-label">フェーズ</label>
        <select class="form-select" id="modal-phase">
          <option value="引渡しまでに行うこと">引渡し前</option>
          <option value="引渡し後に行うこと">引渡し後</option>
          <option value="GO後に行うこと">GO後</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">開始日</label><input type="date" class="form-input" id="modal-start"></div>
      <div class="form-group"><label class="form-label">完了予定日</label><input type="date" class="form-input" id="modal-end"></div>
    </div>
    <div class="form-group"><label class="form-label">ステータス</label>
      <select class="form-select" id="modal-status">
        <option value="todo">⚪ 未着手</option>
        <option value="inprogress">🔵 進行中</option>
        <option value="done">✅ 完了</option>
      </select>
    </div>
    <div class="comment-section" id="comment-section">
      <div style="font-size:13px; font-weight:700; margin-bottom:10px;">💬 コメント</div>
      <div id="comment-list"></div>
      <div class="comment-input-row">
        <input type="text" id="comment-input" placeholder="コメントを入力..." onkeydown="if(event.key==='Enter')addComment()">
        <button class="btn btn-primary btn-sm" onclick="addComment()">送信</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="delete-btn" onclick="deleteTask()" style="color:var(--overdue); border-color:var(--overdue);">削除</button>
      <button class="btn btn-outline" onclick="closeModal('task-modal')">キャンセル</button>
      <button class="btn btn-primary" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<!-- STORE MODAL -->
<div class="modal-overlay" id="store-modal">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">

  stores: [...DEFAULT_STORES],
  currentStoreId: 'store1',
  tasks: {},
  editingTaskId: null,
  nextId: 100,
  db: null,
  fbFns: null,
  _taskUnsub: null,   // ← タスクリスナーの解除関数（1つだけ管理）
};

function currentTasks() { return state.tasks[state.currentStoreId] || []; }
function currentStore() { return state.stores.find(s => s.id === state.currentStoreId); }

// ===== UTILS =====
function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDate(s) { if (!s) return null; return new Date(s + 'T00:00:00'); }
function fmtDate(s) { if (!s) return '—'; const d = parseDate(s); return `${d.getMonth()+1}/${d.getDate()}`; }
function fmtDateFull(s) { if (!s) return '—'; const d = parseDate(s); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }
function getEffectiveStatus(task) {
  if (task.status === 'done') return 'done';
  if (task.end && parseDate(task.end) < TODAY && task.status !== 'done') return 'overdue';
  return task.status;
}
function statusLabel(s) { return { todo:'⚪ 未着手', inprogress:'🔵 進行中', done:'✅ 完了', overdue:'🔴 期限超過' }[s] || s; }
function statusClass(s) { return { todo:'status-todo', inprogress:'status-inprogress', done:'status-done', overdue:'status-overdue' }[s] || ''; }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function showSyncBadge() {
  const b = document.getElementById('sync-badge');
  b.classList.add('show');
  setTimeout(() => b.classList.remove('show'), 1500);
}

// ===== SAVE =====
function saveTasks() {
  if (FB_CONFIGURED && state.db && state.fbFns) {
    const { ref, set } = state.fbFns;
    const tasks = currentTasks().map(t => ({
      ...t,
      comments: t.comments && t.comments.length
        ? Object.fromEntries(t.comments.map((c,i) => [i, c]))
        : {}
    }));
    const obj = Object.fromEntries(tasks.map(t => [String(t.id), t]));
    set(ref(state.db, `stores/${state.currentStoreId}/tasks`), obj)
      .catch(e => console.error('Firebase write error:', e));
  } else {
    localStorage.setItem(`gc_tasks_${state.currentStoreId}`, JSON.stringify(currentTasks()));
  }
}

function saveStores() {
  if (FB_CONFIGURED && state.db && state.fbFns) {
    const { ref, set } = state.fbFns;
    const obj = Object.fromEntries(state.stores.map(s => [s.id, { name: s.name, goDate: s.goDate || '' }]));
    set(ref(state.db, 'storesMeta'), obj).catch(e => console.error('Firebase write error:', e));
  } else {
    localStorage.setItem('gc_stores', JSON.stringify(state.stores));
    localStorage.setItem('gc_currentStore', state.currentStoreId);
  }
}

// ===== FIREBASE =====
// ✅ 修正①: タスクリスナーを1つだけ管理し、店舗切替時に張り直す
function subscribeCurrentStore() {
  if (!state.db || !state.fbFns) return;
  const { ref, onValue, set } = state.fbFns;

  // 既存リスナーを解除
  if (state._taskUnsub) { state._taskUnsub(); state._taskUnsub = null; }

  const storeId = state.currentStoreId;
  state._taskUnsub = onValue(ref(state.db, `stores/${storeId}/tasks`), snap => {
    const data = snap.val();
    if (data) {
      state.tasks[storeId] = Object.values(data).map(t => ({
        ...t,
        comments: t.comments
          ? (Array.isArray(t.comments) ? t.comments : Object.values(t.comments))
          : []
      }));
      const maxId = Math.max(...state.tasks[storeId].map(t => Number(t.id) || 0), 100);
      state.nextId = maxId;
    } else {
      // 初回: デフォルトタスクを書き込む
      const store = state.stores.find(s => s.id === storeId);
      const goDate = store?.goDate || '';
      let newTasks = DEFAULT_TASKS.map(t => ({ ...t, comments: {} }));
      if (goDate && goDate !== BASE_GO_DATE) {
        const diff = parseDate(goDate) - parseDate(BASE_GO_DATE);
        newTasks = newTasks.map(t => {
          const nt = { ...t };
          if (t.start) nt.start = toDateStr(new Date(parseDate(t.start).getTime() + diff));
          if (t.end)   nt.end   = toDateStr(new Date(parseDate(t.end).getTime()   + diff));
          if (t.isGoTask) { nt.start = goDate; nt.end = goDate; }
          return nt;
        });
      }
      const obj = Object.fromEntries(newTasks.map(t => [String(t.id), t]));
      set(ref(state.db, `stores/${storeId}/tasks`), obj);
      state.tasks[storeId] = newTasks.map(t => ({ ...t, comments: [] }));
    }
    // 現在表示中のタブを再描画
    const activeTab = document.querySelector('.tab.active')?.id?.replace('tab-','') || 'dashboard';
    if (activeTab === 'dashboard') renderDashboard();
    else if (activeTab === 'tasks') renderTasks();
    else if (activeTab === 'gantt') renderGantt();
    showSyncBadge();
  });
}

function initFirebase() {
  if (!FB_CONFIGURED) {
    // localStorageモード
    const savedStores = localStorage.getItem('gc_stores');
    if (savedStores) { try { state.stores = JSON.parse(savedStores); } catch(e) {} }
    const savedId = localStorage.getItem('gc_currentStore');
    if (savedId && state.stores.find(s => s.id === savedId)) state.currentStoreId = savedId;
    else state.currentStoreId = state.stores[0]?.id || 'store1';
    state.stores.forEach(s => {
      const saved = localStorage.getItem(`gc_tasks_${s.id}`);
      state.tasks[s.id] = saved ? JSON.parse(saved) : DEFAULT_TASKS.map(t => ({...t, comments:[]}));
    });
    bootApp();

    // 警告バナー
    const banner = document.createElement('div');
    banner.style.cssText = 'background:#f5a623;color:#333;text-align:center;padding:8px;font-size:12px;font-weight:700;';
    banner.textContent = '⚠️ Firebase未設定のためローカル保存モードで動作中。他の端末とは同期されません。';
    document.querySelector('.tabs').insertAdjacentElement('afterend', banner);
    return;
  }

  const waitFb = setInterval(() => {
    if (!window._fbReady) return;
    clearInterval(waitFb);
    const { initializeApp, getDatabase, ref, set, onValue } = window._fbReady;
    state.fbFns = window._fbReady;
    const app = initializeApp(FIREBASE_CONFIG);
    state.db = getDatabase(app);

    // ✅ 修正②: storesMeta は初回のみ subscribeCurrentStore を呼ぶ
    let storesReady = false;
    onValue(ref(state.db, 'storesMeta'), snap => {
      const data = snap.val();
      if (data) {
        state.stores = Object.entries(data).map(([id, v]) => ({ id, name: v.name, goDate: v.goDate || '' }));
        // 現在の店舗IDが存在しない場合は最初の店舗に切り替え
        if (!state.stores.find(s => s.id === state.currentStoreId)) {
          state.currentStoreId = state.stores[0]?.id || 'store1';
        }
      } else {
        const obj = Object.fromEntries(DEFAULT_STORES.map(s => [s.id, { name: s.name, goDate: s.goDate }]));
        set(ref(state.db, 'storesMeta'), obj);
        state.stores = [...DEFAULT_STORES];
      }
      updateStoreUI();
      if (!storesReady) {
        storesReady = true;
        subscribeCurrentStore(); // ← 初回のみ
        bootApp();
      }
    });
  }, 100);
}

function updateStoreUI() {
  const store = currentStore();
  if (!store) return;
  document.getElementById('currentStoreName').textContent = store.name;
  const goInput = document.getElementById('header-go-date');
  if (goInput && store.goDate) goInput.value = store.goDate;
}

function bootApp() {
  updateStoreUI();
  renderDashboard();
  document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
  });
}

// ===== TABS =====
function switchTab(tab) {
  ['dashboard','tasks','gantt'].forEach(v => {
    document.getElementById(`view-${v}`).classList.toggle('hidden', v !== tab);
    document.getElementById(`tab-${v}`).classList.toggle('active', v === tab);
  });
  if (tab === 'dashboard') renderDashboard();
  if (tab === 'tasks') renderTasks();
  if (tab === 'gantt') renderGantt();
}

// ===== DASHBOARD =====
function renderDashboard() {
  const tasks = currentTasks();
  const store = currentStore();
  const total = tasks.length;
  const done = tasks.filter(t => getEffectiveStatus(t) === 'done').length;
  const inprogress = tasks.filter(t => getEffectiveStatus(t) === 'inprogress').length;
  const todo = tasks.filter(t => getEffectiveStatus(t) === 'todo').length;
  const overdue = tasks.filter(t => getEffectiveStatus(t) === 'overdue').length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-inprogress').textContent = inprogress;
  document.getElementById('stat-todo').textContent = todo;
  document.getElementById('stat-overdue').textContent = overdue;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-bar').style.width = pct + '%';

  const phases = ['引渡しまでに行うこと','引渡し後に行うこと','GO後に行うこと'];
  const phaseLabels = ['引渡し前','引渡し後','GO後'];
  const phaseColors = ['#1a6b3c','#3b82f6','#f5a623'];
  document.getElementById('phase-progress').innerHTML = phases.map((ph, i) => {
    const pt = tasks.filter(t => t.phase === ph);
    const pd = pt.filter(t => getEffectiveStatus(t) === 'done').length;
    const pp = pt.length ? Math.round(pd / pt.length * 100) : 0;
    return `<div class="phase-chip"><div class="phase-dot" style="background:${phaseColors[i]}"></div><strong>${phaseLabels[i]}</strong>: ${pd}/${pt.length} (${pp}%)</div>`;
  }).join('');

  const upcoming = tasks.filter(t => {
    if (getEffectiveStatus(t) === 'done' || !t.end) return false;
    const diff = (parseDate(t.end) - TODAY) / 86400000;
    return diff >= 0 && diff <= 7;
  }).sort((a,b) => parseDate(a.end) - parseDate(b.end));
  document.getElementById('upcoming-tasks').innerHTML = upcoming.length === 0
    ? '<div style="color:var(--text-muted); font-size:13px;">期限が近いタスクはありません</div>'
    : upcoming.map(t => {
        const s = getEffectiveStatus(t);
        return `<div style="display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border);">
          <span class="status-badge ${statusClass(s)}">${statusLabel(s)}</span>
          <div style="flex:1; font-size:13px; font-weight:600;">${t.name}</div>
          <div style="font-size:12px; color:var(--overdue); font-weight:700;">${fmtDate(t.end)}</div>
        </div>`;
      }).join('');

  const assignees = {};
  tasks.forEach(t => {
    const a = t.assignee || '未設定';
    if (!assignees[a]) assignees[a] = {total:0, done:0};
    assignees[a].total++;
    if (getEffectiveStatus(t) === 'done') assignees[a].done++;
  });
  document.getElementById('assignee-stats').innerHTML = Object.entries(assignees).map(([a, v]) => {
    const p = Math.round(v.done / v.total * 100);
    return `<div style="margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;">
        <span class="assignee-badge">${a}</span>
        <span style="color:var(--text-muted);">${v.done}/${v.total} (${p}%)</span>
      </div>
      <div class="progress-bar-bg" style="height:6px;"><div class="progress-bar-fill" style="width:${p}%"></div></div>
    </div>`;
  }).join('');

  if (store && store.goDate) {
    const diff = Math.ceil((parseDate(store.goDate) - TODAY) / 86400000);
    document.getElementById('countdown-days').textContent = diff > 0 ? diff + '日' : diff === 0 ? '🎉 本日GO！' : `GO済み (+${Math.abs(diff)}日)`;
    document.getElementById('countdown-date').textContent = `グランドオープン: ${fmtDateFull(store.goDate)}`;
  }
}

// ===== TASK LIST =====
// ✅ 修正③: 担当者はインライン入力を廃止し、モーダル経由のみに統一（Firebase競合を防ぐ）
function renderTasks() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const filterStatus = document.getElementById('filter-status').value;
  const filterPhase = document.getElementById('filter-phase').value;
  const filterAssignee = document.getElementById('filter-assignee').value;

  const assignees = [...new Set(currentTasks().map(t => t.assignee).filter(Boolean))];
  const sel = document.getElementById('filter-assignee');
  const cur = sel.value;
  sel.innerHTML = '<option value="">すべての担当者</option>' + assignees.map(a => `<option value="${a}" ${a===cur?'selected':''}>${a}</option>`).join('');

  const phases = ['引渡しまでに行うこと','引渡し後に行うこと','GO後に行うこと'];
  const phaseLabels = { '引渡しまでに行うこと':'🏗️ 引渡し前', '引渡し後に行うこと':'🏪 引渡し後', 'GO後に行うこと':'🎉 GO後' };

  let html = '';
  phases.forEach(phase => {
    if (filterPhase && filterPhase !== phase) return;
    let tasks = currentTasks().filter(t => t.phase === phase);
    if (search) tasks = tasks.filter(t => t.name.toLowerCase().includes(search) || (t.desc||'').toLowerCase().includes(search));
    if (filterStatus) tasks = tasks.filter(t => getEffectiveStatus(t) === filterStatus);
    if (filterAssignee) tasks = tasks.filter(t => t.assignee === filterAssignee);
    if (tasks.length === 0) return;

    html += `<div class="phase-section">
      <div class="phase-header" onclick="togglePhase(this)">
        <div class="phase-title">${phaseLabels[phase]}</div>
        <div class="phase-count">${tasks.length}</div>
        <div class="phase-toggle">▾</div>
      </div>
      <div class="phase-body">
      <table class="task-table">
        <thead><tr>
          <th style="width:24px;"></th>
          <th>タスク名</th>
          <th>担当者</th>
          <th>開始日</th>
          <th>完了予定日</th>
          <th>ステータス</th>
          <th>操作</th>
        </tr></thead><tbody>`;

    tasks.forEach(t => {
      const s = getEffectiveStatus(t);
      html += `<tr>
        <td><input type="checkbox" ${t.status==='done'?'checked':''} onchange="toggleDone(${JSON.stringify(t.id)}, this.checked)" style="width:16px;height:16px;cursor:pointer;accent-color:var(--primary);"></td>
        <td>
          <div class="task-name">${t.name}</div>
          ${t.desc ? `<div class="task-desc">${t.desc.substring(0,60)}${t.desc.length>60?'…':''}</div>` : ''}
        </td>
        <td>${t.assignee ? `<span class="assignee-badge">${t.assignee}</span>` : '<span style="color:var(--text-muted);">—</span>'}</td>
        <td class="date-cell">${fmtDate(t.start)}</td>
        <td class="date-cell ${s==='overdue'?'date-overdue':''}">${fmtDate(t.end)}${s==='overdue'?' ⚠️':''}</td>
        <td><span class="status-badge ${statusClass(s)}">${statusLabel(s)}</span></td>
        <td><button class="action-btn" onclick="openEditModal(${JSON.stringify(t.id)})">✏️ 編集</button></td>
      </tr>`;
    });
    html += `</tbody></table></div></div>`;
  });

  if (!html) html = `<div class="empty-state"><div class="empty-icon">🔍</div><div>条件に一致するタスクがありません</div></div>`;
  document.getElementById('task-list-container').innerHTML = html;
}

function togglePhase(header) {
  const body = header.nextElementSibling;
  const toggle = header.querySelector('.phase-toggle');
  body.classList.toggle('hidden');
  toggle.classList.toggle('collapsed');
}

function toggleDone(id, checked) {
  const task = currentTasks().find(t => t.id == id);
  if (task) {
    task.status = checked ? 'done' : 'todo';
    saveTasks();
    showToast(checked ? '✅ 完了にしました' : '⚪ 未着手に戻しました');
    // Firebaseモードでは onValue が自動再描画するので不要だが、localStorageモードのために呼ぶ
    if (!FB_CONFIGURED) renderTasks();
  }
}

// ===== MODAL =====
function openAddModal() {
  state.editingTaskId = null;
  document.getElementById('modal-title').textContent = '＋ タスク追加';
  ['modal-name','modal-desc','modal-memo','modal-assignee','modal-start','modal-end'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('modal-phase').value = '引渡しまでに行うこと';
  document.getElementById('modal-status').value = 'todo';
  document.getElementById('comment-section').classList.add('hidden');
  document.getElementById('delete-btn').classList.add('hidden');
  document.getElementById('task-modal').classList.add('open');
}

function openEditModal(id) {
  const task = currentTasks().find(t => t.id == id);
  if (!task) return;
  state.editingTaskId = task.id;
  document.getElementById('modal-title').textContent = '✏️ タスク編集';
  document.getElementById('modal-name').value = task.name || '';
  document.getElementById('modal-desc').value = task.desc || '';
  document.getElementById('modal-memo').value = task.memo || '';
  document.getElementById('modal-assignee').value = task.assignee || '';
  document.getElementById('modal-phase').value = task.phase || '引渡しまでに行うこと';
  document.getElementById('modal-start').value = task.start || '';
  document.getElementById('modal-end').value = task.end || '';
  document.getElementById('modal-status').value = task.status || 'todo';
  document.getElementById('comment-section').classList.remove('hidden');
  document.getElementById('delete-btn').classList.remove('hidden');
  renderComments(task);
  document.getElementById('task-modal').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function saveTask() {
  const name = document.getElementById('modal-name').value.trim();
  if (!name) { showToast('⚠️ タスク名を入力してください'); return; }
  if (state.editingTaskId !== null) {
    const task = currentTasks().find(t => t.id == state.editingTaskId);
    if (task) {
      task.name = name;
      task.desc = document.getElementById('modal-desc').value;
      task.memo = document.getElementById('modal-memo').value;
      task.assignee = document.getElementById('modal-assignee').value;
      task.phase = document.getElementById('modal-phase').value;
      task.start = document.getElementById('modal-start').value;
      task.end = document.getElementById('modal-end').value;
      task.status = document.getElementById('modal-status').value;
    }
    showToast('✅ タスクを更新しました');
  } else {
    currentTasks().push({
      id: ++state.nextId,
      phase: document.getElementById('modal-phase').value,
      name, desc: document.getElementById('modal-desc').value,
      memo: document.getElementById('modal-memo').value,
      assignee: document.getElementById('modal-assignee').value,
      start: document.getElementById('modal-start').value,
      end: document.getElementById('modal-end').value,
      status: document.getElementById('modal-status').value,
      comments: []
    });
    showToast('✅ タスクを追加しました');
  }
  saveTasks();
  closeModal('task-modal');
  if (!FB_CONFIGURED) renderTasks();
}

function deleteTask() {
  if (!confirm('このタスクを削除しますか？')) return;
  const idx = currentTasks().findIndex(t => t.id == state.editingTaskId);
  if (idx !== -1) currentTasks().splice(idx, 1);
  saveTasks();
  closeModal('task-modal');
  showToast('🗑️ タスクを削除しました');
  if (!FB_CONFIGURED) renderTasks();
}

// ===== COMMENTS =====
function renderComments(task) {
  const list = document.getElementById('comment-list');
  if (!task.comments || task.comments.length === 0) {
    list.innerHTML = '<div style="color:var(--text-muted); font-size:12px; margin-bottom:8px;">コメントはまだありません</div>';
    return;
  }
  list.innerHTML = task.comments.map(c => `
    <div class="comment-item">
      <div class="comment-meta">${c.author} · ${c.date}</div>
      <div class="comment-text">${c.text}</div>
    </div>`).join('');
}

function addComment() {
  const input = document.getElementById('comment-input');
  const text = input.value.trim();
  if (!text) return;
  const task = currentTasks().find(t => t.id == state.editingTaskId);
  if (!task) return;
  if (!task.comments) task.comments = [];
  const now = new Date();
  task.comments.push({
    author: '玉田貴浩',
    date: `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`,
    text
  });
  input.value = '';
  saveTasks();
  renderComments(task);
}

// ===== GANTT =====
function renderGantt() {
  const filterPhase = document.getElementById('gantt-filter-phase').value;
  const filterStatus = document.getElementById('gantt-filter-status').value;
  let tasks = currentTasks().filter(t => t.start && t.end);
  if (filterPhase) tasks = tasks.filter(t => t.phase === filterPhase);
  if (filterStatus) tasks = tasks.filter(t => getEffectiveStatus(t) === filterStatus);
  if (tasks.length === 0) {
    document.getElementById('gantt-content').innerHTML = '<div class="empty-state"><div class="empty-icon">📅</div><div>表示できるタスクがありません</div></div>';
    return;
  }
  const allDates = tasks.flatMap(t => [parseDate(t.start), parseDate(t.end)]).filter(Boolean);
  let minDate = new Date(Math.min(...allDates)); minDate.setDate(minDate.getDate() - 3);
  let maxDate = new Date(Math.max(...allDates)); maxDate.setDate(maxDate.getDate() + 7);
  const dates = [];
  let d = new Date(minDate);
  while (d <= maxDate) { dates.push(new Date(d)); d.setDate(d.getDate() + 1); }
  const months = {};
  dates.forEach(d => {
    const key = `${d.getFullYear()}-${d.getMonth()+1}`;
    if (!months[key]) months[key] = { label: `${d.getFullYear()}年${d.getMonth()+1}月`, count: 0 };
    months[key].count++;
  });
  let html = '<table class="gantt-table"><thead><tr><th class="task-col month-header">タスク名</th>';
  Object.values(months).forEach(m => { html += `<th class="month-header" colspan="${m.count}">${m.label}</th>`; });
  html += '</tr><tr><th class="task-col">担当 / フェーズ</th>';
  dates.forEach(d => {
    const isToday = d.toDateString() === TODAY.toDateString();
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    html += `<th style="${isToday?'background:var(--accent);color:#333;':isWeekend?'background:#2a5a3a;opacity:0.7;':''}">${d.getDate()}</th>`;
  });
  html += '</tr></thead><tbody>';
  const phaseLabels = { '引渡しまでに行うこと':'引渡し前', '引渡し後に行うこと':'引渡し後', 'GO後に行うこと':'GO後' };
  tasks.forEach(t => {
    const s = getEffectiveStatus(t);
    const barClass = { done:'done', inprogress:'inprogress', overdue:'overdue', todo:'' }[s] || '';
    html += `<tr><td class="task-col" onclick="openEditModal(${JSON.stringify(t.id)})" style="cursor:pointer;">
      <div style="font-weight:700; font-size:12px;">${t.name}</div>
      <div style="font-size:10px; color:var(--text-muted);">${t.assignee||''} ${phaseLabels[t.phase]||''}</div>
    </td>`;
    dates.forEach(d => {
      const isToday = d.toDateString() === TODAY.toDateString();
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const inRange = d >= parseDate(t.start) && d <= parseDate(t.end);
      const isStart = d.toDateString() === parseDate(t.start).toDateString();
      const isEnd = d.toDateString() === parseDate(t.end).toDateString();
      const cellStyle = isToday ? 'background:rgba(245,166,35,0.15);' : isWeekend ? 'background:#fafafa;' : '';
      const br = isStart && isEnd ? '4px' : isStart ? '4px 0 0 4px' : isEnd ? '0 4px 4px 0' : '0';
      html += `<td style="${cellStyle} padding:4px 1px;">${inRange ? `<div class="gantt-bar ${barClass}" style="border-radius:${br};"></div>` : ''}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('gantt-content').innerHTML = html;
}

// ===== GO日 =====
function onHeaderGoDateChange() {
  const val = document.getElementById('header-go-date').value;
  const store = currentStore();
  if (!store || !val) return;
  store.goDate = val;
  // GOタスクの日付を同期
  const goTask = currentTasks().find(t => t.isGoTask);
  if (goTask) { goTask.start = val; goTask.end = val; }
  saveTasks();
  saveStores();
  renderDashboard();
  if (!document.getElementById('view-tasks').classList.contains('hidden')) renderTasks();
  if (!document.getElementById('view-gantt').classList.contains('hidden')) renderGantt();
}

// ===== STORE MODAL =====
function openStoreModal() {
  renderStoreList();
  document.getElementById('store-modal').classList.add('open');
}

function renderStoreList() {
  document.getElementById('store-list').innerHTML = state.stores.map(s => `
    <div class="store-item ${s.id === state.currentStoreId ? 'active' : ''}" onclick="switchStore('${s.id}')">
      <div style="flex:1;">
        <div class="store-item-name">🏪 ${s.name}</div>
        <div class="store-item-date">GO日: ${s.goDate ? fmtDateFull(s.goDate) : '未設定'}</div>
      </div>
      ${s.id === state.currentStoreId
        ? '<span style="color:var(--primary); font-weight:700;">✓ 選択中</span>'
        : `<button onclick="event.stopPropagation(); deleteStore('${s.id}')"
            style="background:none; border:1.5px solid #ef4444; color:#ef4444; border-radius:6px;
                   padding:4px 10px; font-size:11px; font-weight:700; cursor:pointer;">
            🗑️ 削除
          </button>`
      }
    </div>`).join('');
}

// ✅ 修正④: 店舗切替時に subscribeCurrentStore を呼んでリスナーを張り直す
function switchStore(id) {
  id = String(id);
  state.currentStoreId = id;
  if (FB_CONFIGURED && state.db) {
    subscribeCurrentStore(); // ← 新しい店舗のリスナーに切り替え
  } else {
    if (!state.tasks[id]) {
      const saved = localStorage.getItem(`gc_tasks_${id}`);
      state.tasks[id] = saved ? JSON.parse(saved) : DEFAULT_TASKS.map(t => ({...t, comments:[]}));
    }
    renderDashboard();
  }
  saveStores();
  updateStoreUI();
  closeModal('store-modal');
  showToast(`🏪 ${currentStore()?.name || ''} に切り替えました`);
}

function addStore() {
  const name = document.getElementById('new-store-name').value.trim();
  const goDate = document.getElementById('new-store-go').value;
  if (!name) { showToast('⚠️ 店舗名を入力してください'); return; }
  const newId = 'store_' + Date.now();
  state.stores.push({ id: newId, name, goDate: goDate || '' });
  saveStores();
  // 新店舗のタスクはFirebaseのonValueで自動生成される（初回書き込みロジック）
  // localStorageモードの場合は手動で初期化
  if (!FB_CONFIGURED) {
    state.tasks[newId] = DEFAULT_TASKS.map(t => ({...t, comments:[], status:'todo'}));
    localStorage.setItem(`gc_tasks_${newId}`, JSON.stringify(state.tasks[newId]));
  }
  document.getElementById('new-store-name').value = '';
  document.getElementById('new-store-go').value = '';
  renderStoreList();
  showToast(`✅ ${name} を追加しました`);
}

// ✅ 修正⑤: 店舗削除 - Firebase・localStorage両方から削除
function deleteStore(id) {
  const store = state.stores.find(s => s.id === id);
  if (!store) return;
  if (!confirm(`「${store.name}」を削除しますか？\nこの店舗のタスクデータもすべて削除されます。`)) return;

  if (FB_CONFIGURED && state.db && state.fbFns) {
    const { ref, remove } = state.fbFns;
    remove(ref(state.db, `storesMeta/${id}`));
    remove(ref(state.db, `stores/${id}`));
  }
  state.stores = state.stores.filter(s => s.id !== id);
  delete state.tasks[id];
  localStorage.removeItem(`gc_tasks_${id}`);

  if (state.currentStoreId === id) {
    state.currentStoreId = state.stores[0]?.id || 'store1';
    if (FB_CONFIGURED && state.db) subscribeCurrentStore();
    updateStoreUI();
    renderDashboard();
  }
  saveStores();
  renderStoreList();
  showToast(`🗑️ ${store.name} を削除しました`);
}
